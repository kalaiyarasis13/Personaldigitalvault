<div class="card flex justify-between items-center p-3.5 mb-2">
  <div class="flex flex-col gap-1">
    <div class="font-semibold text-ink">{{ credential.title }}</div>
    <div class="text-[0.85rem] text-ink-muted" *ngIf="credential.accountUsername">{{ credential.accountUsername }}</div>
    <div class="flex items-center gap-2 mt-1">
      <span class="font-mono tracking-widest text-ink">{{ (revealed ? revealedValue : credential.maskedPassword) | maskSecret:revealed }}</span>
      <button type="button" class="border-none bg-transparent cursor-pointer text-[0.85rem] text-primary hover:underline" (click)="onToggleReveal()">
        {{ revealed ? 'Hide' : 'Reveal' }}
      </button>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <a *ngIf="credential.url" [href]="credential.url" target="_blank" rel="noopener" class="text-success no-underline text-[0.85rem] hover:underline">Open</a>
    <button type="button" class="border-none bg-transparent cursor-pointer text-[0.85rem] text-danger hover:underline" (click)="onDelete()">Delete</button>
  </div>
</div>
