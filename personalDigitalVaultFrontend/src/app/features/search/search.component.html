<div class="max-w-[1080px] mx-auto p-6">
  <div class="page-header">
    <h1>Search</h1>
  </div>

  <form class="search-form" (ngSubmit)="onSubmit()">
    <input
      class="search-box"
      type="text"
      placeholder="Search your documents and credentials..."
      [(ngModel)]="query"
      name="q"
    />
    <button
  type="submit"
  class="search-action-button"
>
  Search
</button>
  </form>

  <div *ngIf="!searched" class="empty-state">Type a term and press Search - it stays in the URL, so results are shareable and survive a refresh.</div>
  <div *ngIf="loading" class="empty-state">Searching...</div>

  <ng-container *ngIf="searched && !loading">
    <section class="section" *ngIf="documents.length > 0">
      <h2>Documents</h2>
      <div class="card list-item" *ngFor="let doc of documents">
        <div class="item-main">
          <span class="item-icon">📄</span>
          <div>
            <div class="item-title">{{ doc.originalFileName }}</div>
            <div class="item-meta">{{ doc.sizeBytes | fileSize }}</div>
          </div>
        </div>
        <div class="item-actions">
          <button class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 bg-transparent text-ink-muted hover:bg-surface-alt hover:text-ink" (click)="viewDocument(doc)">View</button>
          <button class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 bg-transparent text-ink-muted hover:bg-surface-alt hover:text-ink" (click)="downloadDocument(doc)">Download</button>
        </div>
      </div>
    </section>

    <section class="section" *ngIf="credentials.length > 0">
      <h2>Credentials</h2>
      <app-credential-card
        *ngFor="let cred of credentials"
        [credential]="cred"
        [revealed]="isRevealed(cred.id)"
        [revealedValue]="revealedValueFor(cred.id)"
        (toggleReveal)="onToggleReveal($event)"
      ></app-credential-card>
    </section>

    <div class="border border-border rounded shadow-sm backdrop-blur-md transition-all bg-[color-mix(in_srgb,var(--color-surface)_88%,transparent)]" *ngIf="documents.length === 0 && credentials.length === 0">
      <p class="empty-inline">No results for "{{ query }}".</p>
    </div>
  </ng-container>
</div>
