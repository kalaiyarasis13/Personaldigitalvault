<div class="share-page">
    <button class="theme-toggle theme-toggle-floating" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'">
      {{ theme.theme() === "dark" ? "☀️" : "🌙" }}
    </button>
    <div class="card share-card">
      <div class="lock-icon">🔗</div>
      <h1>Shared file</h1>
      <p class="subtitle">Someone shared a file with you from Personal Digital Vault. No account needed.</p>
  
      <button class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 text-white bg-gradient-to-br from-primary to-primary-dark shadow-[0_4px_24px_var(--color-primary-soft),0_1px_2px_rgba(0,0,0,0.2)] hover:brightness-110 hover:-translate-y-px hover:shadow-[0_6px_32px_var(--color-primary-soft),0_2px_4px_rgba(0,0,0,0.25)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none disabled:hover:brightness-100 w-full mt-1.5" (click)="download()" [disabled]="loading">
        {{ loading ? "Preparing download..." : "Download file" }}
      </button>
  
      <p class="error-msg" *ngIf="error">{{ error }}</p>
    </div>
  </div>
