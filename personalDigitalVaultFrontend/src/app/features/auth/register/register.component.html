<div class="auth-page">
  <button class="theme-toggle theme-toggle-floating" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'">
    {{ theme.theme() === "dark" ? "☀️" : "🌙" }}
  </button>
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Create your vault</h1>
    <p class="subtitle">Register to start storing documents and credentials securely.</p>

    <div class="field">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="jane_doe" />
      <span class="error" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
        Minimum 3 characters.
      </span>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="jane@example.com" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email.
      </span>
    </div>

    <div class="field">
      <label>Full name (optional)</label>
      <input type="text" formControlName="fullName" placeholder="Jane Doe" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="At least 8 characters" />
      <span class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Minimum 8 characters.
      </span>
    </div>

    <button
  class="register-submit"
  type="submit"
  [disabled]="submitting"
>
  {{ submitting ? "Creating account..." : "Create account" }}
</button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>
