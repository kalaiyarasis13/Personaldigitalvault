<div class="auth-page">
  <button class="theme-toggle theme-toggle-floating" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'">
    {{ theme.theme() === "dark" ? "☀️" : "🌙" }}
  </button>
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to access your Personal Digital Vault.</p>

    <div class="field">
      <label>Username or email</label>
      <input type="text" formControlName="usernameOrEmail" placeholder="jane_doe or jane@example.com" />
      <span class="error" *ngIf="form.get('usernameOrEmail')?.touched && form.get('usernameOrEmail')?.invalid">
        This field is required.
      </span>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <span class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Password is required.
      </span>
    </div>

    <button class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 text-white bg-gradient-to-br from-primary to-primary-dark shadow-[0_4px_24px_var(--color-primary-soft),0_1px_2px_rgba(0,0,0,0.2)] hover:brightness-110 hover:-translate-y-px hover:shadow-[0_6px_32px_var(--color-primary-soft),0_2px_4px_rgba(0,0,0,0.25)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none disabled:hover:brightness-100 w-full mt-1.5" type="submit" [disabled]="submitting">
      {{ submitting ? "Logging in..." : "Log in" }}
    </button>

    <p class="switch-link">Don't have an account? <a routerLink="/register">Create one</a></p>
  </form>
</div>
