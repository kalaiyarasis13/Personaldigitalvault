<div class="max-w-[1080px] mx-auto p-6">
  <div class="page-header">
    <div>
      <h1>All Credential Records</h1>
      <p class="subtitle">Search across every folder. Passwords stay masked until you reveal them - only one at a time.</p>
    </div>
    <button class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 text-white bg-gradient-to-br from-primary to-primary-dark shadow-[0_4px_24px_var(--color-primary-soft),0_1px_2px_rgba(0,0,0,0.2)] hover:brightness-110 hover:-translate-y-px hover:shadow-[0_6px_32px_var(--color-primary-soft),0_2px_4px_rgba(0,0,0,0.25)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none disabled:hover:brightness-100" (click)="toggleForm()">{{ showForm ? "Cancel" : "+ Add Credential" }}</button>
  </div>

  <form class="card credential-form" *ngIf="showForm" [formGroup]="form" (ngSubmit)="saveCredential()">
    <div class="field">
      <label>Title</label>
      <input type="text" formControlName="title" placeholder="e.g. Gmail account" />
      <p class="field-error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
        Title is required.
      </p>
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" formControlName="accountUsername" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" />
      <p class="field-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Password is required.
      </p>
    </div>
    <div class="field">
      <label>URL (optional)</label>
      <input type="text" formControlName="url" />
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea formControlName="notes" rows="2"></textarea>
    </div>

    <div class="field custom-fields" formArrayName="customFields">
      <label>Custom fields</label>
      <div class="custom-field-row" *ngFor="let field of customFields.controls; let i = index" [formGroupName]="i">
        <input type="text" formControlName="label" placeholder="Field name (e.g. PIN, Email)" />
        <input type="text" formControlName="value" placeholder="Value" />
        <button type="button" class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 bg-transparent text-ink-muted hover:bg-surface-alt hover:text-ink" (click)="removeCustomField(i)">Remove</button>
      </div>
      <button type="button" class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 bg-transparent text-ink-muted hover:bg-surface-alt hover:text-ink" (click)="addCustomField()">+ Add custom field</button>
    </div>

    <p class="field-error" *ngIf="form.errors?.['usernameOrEmailRequired'] && form.touched">
      Provide a username, or add a custom field named "Email".
    </p>

    <div class="form-actions">
      <button type="submit" class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 text-white bg-gradient-to-br from-primary to-primary-dark shadow-[0_4px_24px_var(--color-primary-soft),0_1px_2px_rgba(0,0,0,0.2)] hover:brightness-110 hover:-translate-y-px hover:shadow-[0_6px_32px_var(--color-primary-soft),0_2px_4px_rgba(0,0,0,0.25)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none disabled:hover:brightness-100" [disabled]="saving">{{ saving ? "Saving..." : "Save credential" }}</button>
      <button type="button" class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-full border border-transparent text-sm font-bold tracking-wide transition-all duration-150 active:scale-95 bg-surface-alt text-ink border-border hover:bg-primary-soft hover:border-primary" (click)="toggleForm()">Cancel</button>
    </div>
  </form>

  <input
    class="search-box"
    type="text"
    placeholder="Search by title..."
    [(ngModel)]="search"
    (ngModelChange)="onSearchChange()"
  />

  <div *ngIf="loading" class="empty-state">Loading...</div>

  <div class="border border-border rounded shadow-sm backdrop-blur-md transition-all bg-[color-mix(in_srgb,var(--color-surface)_88%,transparent)]" *ngIf="!loading && credentials.length === 0">
    <p class="empty-inline">No credential records found.</p>
  </div>

  <app-credential-card
    *ngFor="let cred of credentials"
    [credential]="cred"
    [revealed]="isRevealed(cred.id)"
    [revealedValue]="revealedValueFor(cred.id)"
    (toggleReveal)="onToggleReveal($event)"
    (deleteCredential)="deleteCredential($event)"
  ></app-credential-card>
</div>
