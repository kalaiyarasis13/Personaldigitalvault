<div class="max-w-[1080px] mx-auto p-6">
  <h1>Your Profile</h1>

  <div class="card section">
    <h2>Account details</h2>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="field">
        <label>Username</label>
        <input type="text" [value]="auth.currentUser()?.username" disabled />
      </div>
      <div class="field">
        <label>Full name</label>
        <input type="text" formControlName="fullName" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" />
        <span class="error" *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.invalid">
          Enter a valid email.
        </span>
      </div>
      <button
  class="profile-action-button"
  type="submit"
  [disabled]="savingProfile"
>
  {{ savingProfile ? "Saving..." : "Save changes" }}
</button>
    </form>
  </div>

  <div class="card section">
    <h2>Change password</h2>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="field">
        <label>Current password</label>
        <input type="password" formControlName="currentPassword" />
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" formControlName="newPassword" />
        <span class="error" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
          Minimum 8 characters.
        </span>
      </div>
      <button
  class="profile-action-button"
  type="submit"
  [disabled]="savingPassword"
>
  {{ savingPassword ? "Updating..." : "Update password" }}
</button>
    </form>
  </div>
</div>
